[package]
name = "easy-hyprland"
version = "0.1.0"
edition = "2024"
description = "Простая и красивая настройка Hyprland с графическим интерфейсом"
license = "GPL-3.0-or-later"
repository = "https://github.com/NeXtagG/easy-hyprland"

[dependencies]
dirs = "7.0.0"
eframe = "0.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true
